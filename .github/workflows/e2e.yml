name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    if: github.repository == 'CurtainRH/curtain'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: foundry-rs/foundry-toolchain@v1
      - run: bun install --frozen-lockfile
      - name: Run on-chain Anvil E2E tests
        run: bun run test
