name: pool-v2-verifier

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plonk-transfer-verifier:
    if: github.repository == 'CurtainRH/curtain'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend/circuits
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: "1.4.2"
      - name: Install circuit dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile finalized transfer circuit
        run: npm run compile:transfer
      - name: Create disposable CI Powers of Tau
        run: |
          npx snarkjs powersoftau new bn128 14 pool_ci_0000.ptau -v
          entropy="$(openssl rand -hex 32)"
          npx snarkjs powersoftau contribute pool_ci_0000.ptau pool_ci_0001.ptau \
            --name="Curtain CI disposable contribution" -e="$entropy" -v
          npx snarkjs powersoftau prepare phase2 pool_ci_0001.ptau pool_ci_final.ptau -v
      - name: Generate Plonk proving key
        run: npx snarkjs plonk setup pool_transfer.r1cs pool_ci_final.ptau pool_transfer_plonk_dev.zkey
      - name: Prove and verify transfer circuit
        run: npm run prove:transfer:plonk
      - name: Export Solidity verifier
        run: npx snarkjs zkey export solidityverifier pool_transfer_plonk_dev.zkey PoolTransferPlonkVerifier.sol
      - name: Upload development verifier artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pool-v2-plonk-transfer-verifier-${{ github.sha }}
          if-no-files-found: error
          path: |
            backend/circuits/pool_transfer_plonk_dev.vkey.json
            backend/circuits/PoolTransferPlonkVerifier.sol
            backend/circuits/pool_transfer.r1cs
