name: backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'CurtainRH/curtain'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@e76686a987d60980ff694c965e6fc8514945d8b7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: "1.4.2"
      - uses: foundry-rs/foundry-toolchain@de808b1eea699e761c404bda44ba8f21aba30b2c # v1.3.1
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:unit
      - name: forge test
        working-directory: backend/contracts
        run: forge test
      - name: Run Slither Static Analysis
        working-directory: backend/contracts
        run: slither . --compile-force-framework foundry || true

  build-push:
    needs: test
    if: github.repository == 'CurtainRH/curtain' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-operator" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

  deploy:
    needs: build-push
    if: github.repository == 'CurtainRH/curtain' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger operator deploy hook
        env:
          OPERATOR_DEPLOY_HOOK_URL: ${{ secrets.RENDER_OPERATOR_DEPLOY_HOOK_URL || secrets.RENDER_DEPLOY_HOOK_URL || secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$OPERATOR_DEPLOY_HOOK_URL" ]; then
            echo "Operator deploy hook not set (RENDER_OPERATOR_DEPLOY_HOOK_URL / RENDER_DEPLOY_HOOK_URL), skipping."
          else
            echo "Triggering operator deploy hook on Render..."
            curl -fsS -X POST "$OPERATOR_DEPLOY_HOOK_URL" || echo "operator deploy hook unreachable, continuing"
          fi

      - name: Trigger keeper deploy hook
        env:
          KEEPER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_KEEPER_DEPLOY_HOOK_URL || secrets.KEEPER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$KEEPER_DEPLOY_HOOK_URL" ]; then
            echo "Keeper deploy hook not set (RENDER_KEEPER_DEPLOY_HOOK_URL / KEEPER_DEPLOY_HOOK_URL), skipping."
          else
            echo "Triggering keeper deploy hook on Render..."
            curl -fsS -X POST "$KEEPER_DEPLOY_HOOK_URL" || echo "keeper deploy hook unreachable, continuing"
          fi

  release:
    needs: [build-push, deploy]
    if: github.repository == 'CurtainRH/curtain' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: tag
        run: echo "name=backend-$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - run: |
        git tag "${{ steps.tag.outputs.name }}"
        git push origin "${{ steps.tag.outputs.name }}"
      - uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
